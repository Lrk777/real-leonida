name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit + pipeline tests
        run: python -m pytest -q
      - name: Fetch raw data (NOAA, Census, CHR, Zillow, FGS, GBIF)
        run: python -m src.fetch
      - name: Build metrics, findings and dashboard
        run: python -m src.build
      - name: Commit outputs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs site README.md data/raw/manifest.json
          git diff --cached --quiet || git commit -m "Rebuild outputs and dashboard [skip ci]"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
